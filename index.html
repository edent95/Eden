    <title>Eden Tan | Systems Architect & Digital Strategist</title>
    <script>
      // GitHub Pages SPA fallback recovery.
      // Converts /?p=/foo back to /foo after 404 redirect.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (!redirectPath) return;

        var normalized = redirectPath.charAt(0) === '/' ? redirectPath : '/' + redirectPath;
        var target = normalized + window.location.hash;
        window.history.replaceState(null, '', target);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
