<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect: `pathSegmentsToKeep` must match Vite `base` path depth
      // (0 = custom domain at apex; 1 = user.github.io/Repo/ …). Replaced at build time.
      var pathSegmentsToKeep = __PATH_SEGMENTS_TO_KEEP__;

      var l = window.location;
      var pathname = l.pathname.split('/').filter(Boolean);
      var kept = pathname.slice(0, pathSegmentsToKeep);
      var rest = pathname.slice(pathSegmentsToKeep).join('/');

      var base = l.origin + '/' + (kept.length ? kept.join('/') + '/' : '');
      var targetPath = rest ? '/' + rest : '/';
      var redirect = base + '?p=' + encodeURIComponent(targetPath) + l.hash;

      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
