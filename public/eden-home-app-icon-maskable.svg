<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eden Tan">
  <!-- Maskable variant: full-bleed plate, no hairline rules, and the E kept inside
       the central safe circle so Android's circular crop never clips it. -->
  <rect width="512" height="512" fill="#1c1917"/>
  <g fill="#fafaf9">
    <rect x="170" y="164" width="34" height="184" rx="9"/>
    <rect x="170" y="164" width="172" height="34" rx="9"/>
    <rect x="170" y="314" width="172" height="34" rx="9"/>
  </g>
  <rect x="170" y="239" width="106" height="34" rx="9" fill="#7bdcb5"/>
</svg>
