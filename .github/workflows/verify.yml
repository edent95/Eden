name: Eden Harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run executable harness
        run: npm run check
        env:
          HARNESS_BASE_REF: origin/${{ github.base_ref }}

      - name: Upload failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eden-harness-failure
          path: |
            dist
            npm-debug.log*
          if-no-files-found: ignore
