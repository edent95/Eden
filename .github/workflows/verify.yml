name: Eden Harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      # Self-hosted runners reuse one workspace across jobs. A sparse checkout left in it
      # (core.sparseCheckout stays true in .git/config) makes every later checkout contain
      # only the sparse paths — 2026-11-10 verify failed with "lock file is not found".
      - name: Reset leftover sparse checkout
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run executable harness
        run: npm run check
        env:
          HARNESS_BASE_REF: origin/${{ github.base_ref }}

      - name: Upload failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eden-harness-failure
          path: |
            dist
            npm-debug.log*
          if-no-files-found: ignore
