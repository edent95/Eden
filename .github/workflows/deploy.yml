name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Submit every sitemap URL to IndexNow (not only recently changed ones)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      # Self-hosted runners reuse one workspace across jobs. A sparse checkout left in it
      # (core.sparseCheckout stays true in .git/config) makes every later checkout contain
      # only the sparse paths — 2026-11-10 verify failed with "lock file is not found".
      - name: Reset leftover sparse checkout
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check
        env:
          HARNESS_BASE_REF: ${{ github.event.before }}

      # Same artifact actions/upload-pages-artifact builds, but with the system tar:
      # that action calls GNU `gtar` on macOS, which the self-hosted M1 runner does not have.
      - name: Archive Pages artifact
        run: tar -C dist -chf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing / IndexNow which URLs changed. Best-effort: a failure here never fails the deploy.
      # Full checkout on purpose: a sparse one here poisons the shared self-hosted workspace.
      - name: Checkout IndexNow script
        uses: actions/checkout@v4

      - name: Setup Node for IndexNow
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/seo/indexnow.mjs ${{ inputs.indexnow_all && '--all' || '' }}
